$mainMod = SUPER
# app
bind = $mainMod, Q, exec,ghostty
bind = $mainMod, C, killactive
bind = $mainMod, R, exec, tofi-drun --drun-launch=true
bind = $mainMod, E, exec, [float; size 800 600; move 1000 100; opacity 0.85] dolphin
bind = $mainMod, ESCAPE, exec, wlogout

#widow
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r

# window moving
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r

# resize window
binde = $mainMod, minus, resizeactive, -50 0
binde = $mainMod, equal, resizeactive, 50 0

binde = $mainMod SHIFT, equal, resizeactive, 0 50
binde = $mainMod SHIFT, minus, resizeactive, 0 -50

bind = $mainMod, M, fullscreen, 0

bind = $mainMod, V, togglefloating
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# screen shot
bind = ALT, 1, exec, hyprshot -m region -o ~/Pictures/Screenshots

#workspace
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
